
name: XAUUSD Gold Alerts - Scheduled

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: xauusd-gold-alerts
  cancel-in-progress: false

jobs:
  check-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check prediction and send new-candle alert
        env:
          API_URL: https://xauusd-ai-api-ka8j.onrender.com/predict
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import subprocess
          import urllib.request
          import urllib.parse
          from pathlib import Path

          print("Checking XAUUSD prediction API...")

          request = urllib.request.Request(
              os.environ["API_URL"],
              headers={"User-Agent": "XAUUSD-Gold-Alerts"}
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.load(response)
          except Exception as exc:
              raise SystemExit(
                  f"Prediction API request failed: {type(exc).__name__}"
              )

          if data.get("trading_enabled") is not False:
              raise SystemExit(
                  "Safety check failed: automatic trading must be disabled."
              )

          if data.get("status") != "experimental_research_only":
              raise SystemExit(
                  "Prediction is not marked research-only."
              )

          prediction = data.get("prediction")
          if prediction not in ("UP", "DOWN"):
              raise SystemExit("Invalid prediction direction.")

          candle_time = data.get("latest_closed_candle_utc")
          if not isinstance(candle_time, str) or not candle_time:
              raise SystemExit("Missing closed-candle timestamp.")

          delay = data.get("candle_delay_minutes")
          if (
              not isinstance(delay, (int, float))
              or not math.isfinite(delay)
              or delay < 0
              or delay > 15
          ):
              raise SystemExit(
                  "Candle data is stale or its age is invalid."
              )

          price = data.get("candle_close_price")
          score = data.get("model_score")

          if (
              not isinstance(price, (int, float))
              or not math.isfinite(price)
          ):
              raise SystemExit("Invalid candle close price.")

          if (
              not isinstance(score, (int, float))
              or not math.isfinite(score)
          ):
              raise SystemExit("Invalid model score.")

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token or not chat_id:
              raise SystemExit(
                  "Telegram secrets are missing from GitHub settings."
              )

          state_path = Path(".github/last_signal.json")
          state_path.parent.mkdir(parents=True, exist_ok=True)

          try:
              previous = json.loads(
                  state_path.read_text(encoding="utf-8")
              )
          except FileNotFoundError:
              previous = {}

          if previous.get("candle_time") == candle_time:
              print(
                  f"No new closed candle ({candle_time}); "
                  "skipping duplicate alert."
              )
              raise SystemExit(0)

          direction = (
              "BUY / UP" if prediction == "UP" else "SELL / DOWN"
          )

          message = (
              "🟡 XAUUSD M5 Research Alert\n\n"
              f"Direction: {direction}\n"
              f"Closed candle (UTC): {candle_time}\n"
              f"Candle close price: {price}\n"
              f"Experimental model score: {score}\n"
              f"Candle delay: {delay:.2f} minutes\n\n"
              "⚠️ Experimental research only. The model score is not "
              "a reliable probability of profit. This is not a "
              "guaranteed trading signal. No trades are placed "
              "automatically."
          )

          print("New candle detected. Sending Telegram alert...")

          telegram_url = (
              f"https://api.telegram.org/bot{token}/sendMessage"
          )
          payload = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message
          }).encode()

          telegram_request = urllib.request.Request(
              telegram_url,
              data=payload,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  telegram_request, timeout=30
              ) as response:
                  result = json.load(response)
          except Exception as exc:
              raise SystemExit(
                  f"Telegram delivery request failed: "
                  f"{type(exc).__name__}"
              )

          if not result.get("ok"):
              raise SystemExit("Telegram did not confirm delivery.")

          print("Telegram confirmed delivery.")

          state_path.write_text(
              json.dumps({
                  "candle_time": candle_time,
                  "prediction": prediction
              }, indent=2) + "\n",
              encoding="utf-8"
          )

          subprocess.run(
              [
                  "git", "config", "user.name",
                  "github-actions[bot]"
              ],
              check=True
          )
          subprocess.run(
              [
                  "git", "config", "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              ],
              check=True
          )

          subprocess.run(
              ["git", "add", str(state_path)],
              check=True
          )

          changed = subprocess.run(
              ["git", "diff", "--cached", "--quiet"]
          )

          if changed.returncode == 0:
              print("No state change to commit.")
          else:
              subprocess.run(
                  [
                      "git", "commit", "-m",
                      "Save last alerted XAUUSD candle"
                  ],
                  check=True
              )
              subprocess.run(["git", "push"], check=True)

          print("Alert completed successfully.")
          PY
